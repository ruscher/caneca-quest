endings:
  - id: homecoming
    kind: victory
    name: { pt-BR: "O Caminho de Casa", en: "The Way Home" }
    text:
      pt-BR: |-
        O Relógio volta a andar, e a névoa se desfaz como açúcar em café quente. Um a um, os objetos perdidos se lembram de quem foram.

        Noir guia a procissão pela cidade adormecida: colheres, bules, lanternas e uma caneca à frente. Ao amanhecer, uma jovem chamada Lia empurra a porta emperrada do Café Aurora — e encontra tudo no lugar, brilhando, como se a cafeteria tivesse esperado por ela.

        Dias depois, uma senhora de cabelos brancos entra apoiada no braço da neta. Ela para diante da mesa perto da janela, segura você com as duas mãos e sorri.

        — A primeira caneca — sussurra Ilda. — Eu sabia que você ia cuidar de tudo.

        Você não é o herói que o mundo esperava. Mas é exatamente o que este lugar precisava.
      en: |-
        The Clock ticks again, and the mist dissolves like sugar in hot coffee. One by one, the lost objects remember who they were.

        Noir leads the procession through the sleeping city: spoons, teapots, lanterns, and a mug at the front. At dawn, a young woman named Lia pushes open the stuck door of Café Aurora — and finds everything in place, gleaming, as if the café had been waiting for her.

        Days later, a white-haired lady walks in leaning on her granddaughter's arm. She stops at the table by the window, holds you with both hands and smiles.

        "The first mug," Ilda whispers. "I knew you'd take care of everything."

        You are not the hero the world expected. But you are exactly what this place needed.
  - id: warm_heart
    kind: victory
    name: { pt-BR: "Coração Quente", en: "Warm Heart" }
    text:
      pt-BR: |-
        Você derrama o seu café, ainda quente, sobre a mola congelada. O vapor sobe como um suspiro, e o Relógio dá o primeiro tique em meses.

        A floresta acorda. Os objetos se lembram de seus nomes, de suas casas, de quem os amou. Você está quase vazia — mas nunca se sentiu tão cheia.

        Mestra Colher a nomeia Guardiã do Calor. Alguns objetos voltarão para casa; outros ficarão. E toda noite, quando a névoa ameaça voltar, é a sua porcelana morna que acende o caminho.
      en: |-
        You pour your coffee, still warm, over the frozen spring. Steam rises like a sigh, and the Clock gives its first tick in months.

        The forest wakes. The objects remember their names, their homes, those who loved them. You're nearly empty — yet you've never felt so full.

        Mistress Spoon names you Keeper of Warmth. Some objects will go home; others will stay. And every night, when the mist threatens to return, it's your warm porcelain that lights the way.
  - id: cold_gear
    kind: bittersweet
    name: { pt-BR: "Engrenagem Fria", en: "Cold Gear" }
    text:
      pt-BR: |-
        A engrenagem dourada se encaixa com um clique seco. O Relógio volta a andar — mas a mola continua fria, e cada tique soa como um passo sobre gelo.

        Os objetos se lembram do que eram, mas não do que sentiam. A floresta segue cinzenta, organizada, silenciosa.

        Você salvou o tempo. Talvez um dia alguém traga de volta o calor.
      en: |-
        The golden gear clicks into place. The Clock moves again — but the spring is still cold, and every tick sounds like a footstep on ice.

        The objects remember what they were, but not what they felt. The forest stays grey, orderly, quiet.

        You saved time itself. Perhaps one day someone will bring back the warmth.
