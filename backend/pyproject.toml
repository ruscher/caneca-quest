[project]
name = "caneca-quest-backend"
version = "0.1.0"
description = "Caneca Quest — motor narrativo, persistência e integração de IA"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "httpx>=0.27",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "httpx2>=2.16.0",
]

[project.scripts]
caneca-server = "caneca.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caneca"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# Player-facing prose and prompt templates: wrapping sentences would hurt readability.
"caneca/game/messages.py" = ["E501"]
"caneca/ai/prompts.py" = ["E501"]
"caneca/persistence/migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:caneca.*"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["caneca/persistence/migrations/"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
