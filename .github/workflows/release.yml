name: Release builds

# Desktop installers for Linux, Windows and macOS. Runs on version tags or manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: msi,nsis
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - run: uv sync --locked --project backend
      - run: uv run --project backend --with pyinstaller python scripts/build_sidecar.py
      - run: npm ci
      - run: npm run build -w @caneca/web
      - run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: caneca-quest-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/**/*
